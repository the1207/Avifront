<div class="relative">
  <button
    type="button"
    class="flex max-w-[min(16rem,55vw)] items-center gap-2 text-gray-700 dark:text-gray-300"
    aria-label="Menu du compte"
    [attr.aria-expanded]="isOpen"
    (click)="toggleDropdown($event)"
  >
    <span class="flex size-9 shrink-0 items-center justify-center rounded-full bg-brand-100 text-sm font-semibold text-brand-700 dark:bg-brand-500/15 dark:text-brand-300">
      {{ initiales() }}
    </span>
    <span class="hidden truncate text-sm font-medium sm:block">{{ auth.email() }}</span>
    <svg class="size-4 shrink-0 text-gray-500 transition-transform" [ngClass]="{ 'rotate-180': isOpen }" viewBox="0 0 20 20" fill="none" aria-hidden="true">
      <path d="m5 7.5 5 5 5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>

  @if (isOpen) {
    <div class="absolute end-0 top-full z-50 mt-3 w-64 rounded-lg border border-gray-200 bg-white p-3 shadow-theme-lg dark:border-gray-800 dark:bg-gray-dark">
      <div class="border-b border-gray-100 px-2 pb-3 dark:border-gray-800">
        <p class="truncate text-sm font-medium text-gray-800 dark:text-white/90">{{ auth.email() }}</p>
        <p class="mt-1 text-xs text-gray-500 dark:text-gray-400">{{ auth.role() }}</p>
      </div>
      <button
        type="button"
        class="mt-3 flex w-full items-center rounded-lg px-3 py-2 text-start text-sm font-medium text-gray-700 hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-white/5"
        (click)="seDeconnecter()"
      >
        Se déconnecter
      </button>
    </div>
  }
</div>
