<header class="sticky top-0 z-40 w-full border-b border-gray-200 bg-white dark:border-gray-800 dark:bg-gray-900">
  <div class="flex min-h-16 items-center justify-between gap-4 px-3 py-3 sm:px-5 xl:px-6">
    <div class="flex min-w-0 items-center gap-3">
      <button
        type="button"
        class="flex size-10 shrink-0 items-center justify-center rounded-lg border border-gray-200 text-gray-600 hover:bg-gray-50 dark:border-gray-800 dark:text-gray-300 dark:hover:bg-white/5 xl:size-11"
        [ngClass]="{ 'bg-gray-100 dark:bg-white/[0.03]': isMobileOpen$ | async }"
        (click)="handleToggle()"
        aria-label="Ouvrir ou réduire le menu"
      >
        @if (isMobileOpen$ | async) {
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
        } @else {
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
        }
      </button>
      <a routerLink="/" class="truncate font-semibold text-gray-900 dark:text-white/90 xl:hidden">Aviform</a>
    </div>

    <div class="flex shrink-0 items-center gap-3 sm:gap-4">
      <app-theme-toggle-button />
      <app-user-dropdown />
    </div>
  </div>
</header>
